<form class="form-horizontal" [formGroup]="formulario" (ngSubmit)="onSubmit()">

    <app-input-field class="col-sm-12" formControlName="nome"
      [classeCss]="aplicaCssErro('nome')"
      id="nome" label="Nome" [control]="formulario.get('nome')"
    ></app-input-field>
  
    
  
    <div class="form-group" [ngClass]="aplicaCssErro('email')">
      <div class="col-sm-12">
        <label for="email" class="control-label">Email</label>
      </div>
      <div class="col-sm-12">
        <input type="email" class="form-control" formControlName="email" id="email" placeholder="nome@email.com">
        <app-error-msg [control]="$any(formulario.get('email'))" label="Email"></app-error-msg>
       
        <app-campo-control-erro [mostrarErro]="$any(formulario.get('email')).status === 'PENDING'"
          msgErro="Validando email...">
        </app-campo-control-erro>
        <app-campo-control-erro [mostrarErro]="$any(formulario.get('email')).status === 'VALID'"
          msgErro="Email válido!">
        </app-campo-control-erro>
       
      </div>
    </div>
  
    <div class="form-group" [ngClass]="aplicaCssErro('confirmarEmail')">
      <div class="col-sm-12">
        <label for="confirmarEmail" class="control-label">Confirmar Email</label>
      </div>
      <div class="col-sm-12">
        <input type="confirmarEmail" class="form-control" formControlName="confirmarEmail" id="confirmarEmail" placeholder="nome@email.com">
        <app-error-msg [control]="$any(formulario.get('confirmarEmail'))" label="Confirmar Email"></app-error-msg>
      
      </div>
    </div>

    <div class="form-group" [ngClass]="aplicaCssErro('senha')">
      <div class="col-sm-12">
        <label for="senha" class="control-label">Senha</label>
      </div>
      <div class="col-sm-12">
        <input type="text" class="form-control" formControlName="senha" id="senha" placeholder="ex 123456">
        <app-error-msg [control]="$any(formulario.get('senha'))" label="Senha"></app-error-msg>
      
      </div>
    </div>
  
    <div formGroupName="endereco">
  
      <div class="form-group">
  
        <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.cep')">
          <label for="cep" class="control-label">CEP</label>
          <input type="text" class="form-control" id="cep" formControlName="cep">
          <app-error-msg [control]="$any(formulario.get('endereco.cep'))" label="CEP"></app-error-msg>
        
        </div>
  
        <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.numero')">
          <label for="numero" class="control-label">Número</label>
          <input type="text" class="form-control" id="numero" formControlName="numero">
          <app-error-msg [control]="$any(formulario.get('endereco.numero'))" label="Número"></app-error-msg>
         
        </div>
  
        <div class="col-md-6">
          <label for="complemento" class="control-label">Complemento</label>
          <input type="text" class="form-control" id="complemento" formControlName="complemento">
        </div>
  
      </div>
  
      <div class="form-group" [ngClass]="aplicaCssErro('endereco.rua')">
        <div class="col-sm-12">
          <label for="rua" class="control-label">Rua</label>
        </div>
        <div class="col-sm-12">
          <input type="text" class="form-control" id="rua" formControlName="rua">
          <app-error-msg [control]="$any(formulario.get('endereco.rua'))" label="Rua"></app-error-msg>
         
        </div>
      </div>
  
      <div class="form-group">
        <div class="col-md-5" [ngClass]="aplicaCssErro('endereco.bairro')">
          <label for="bairro" class="control-label">Bairro</label>
          <input type="text" class="form-control" id="bairro" formControlName="bairro">
          <app-error-msg [control]="$any(formulario.get('endereco.bairro'))" label="Bairro"></app-error-msg>
         
        </div>
  
        <div class="col-md-4" [ngClass]="aplicaCssErro('endereco.cidade')">
          <label for="cidade" class="control-label">Cidade</label>
          <select class="form-control" id="cidade" formControlName="cidade">
            <option *ngFor="let cidade of cidades" [value]="cidade.nome">{{ cidade.nome }}</option>
          </select>
          <app-error-msg [control]="$any(formulario.get('endereco.cidade'))" label="Cidade"></app-error-msg>
         
        </div>
  
        
  
        <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.estado')">
          <label for="estado" class="control-label">Estado</label>
          <select class="form-control" id="estado" formControlName="estado">
            <option *ngFor="let estado of estados" [value]="estado.sigla">{{ estado.nome }}</option>
          </select>
          <app-error-msg [control]="$any(formulario.get('endereco.estado'))" label="Estado"></app-error-msg>
          <!--app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.estado')" msgErro="Estado é obrigatório.">
          </app-campo-control-erro -->
        </div>
      </div>
  
    </div>
  
  
    <div class="form-group">
      <div class="col-md-3" [ngClass]="aplicaCssErro('termos')">
        <div class="checkbox">
          <label class="checkbox-inline">
            <input type="checkbox" formControlName="termos"> Aceito os termos.
          </label>
          <app-error-msg [control]="$any(formulario.get('termos'))" label="Aceito os termos"></app-error-msg>
         
        </div>
      </div>
    </div>
  
    <button type="submit" class="btn btn-primary">Submit</button> 
    
    <button type="button" class="btn btn-default" (click)="onCancel()">Cancelar</button>
    <br>
    <br>
   
    
  </form>
