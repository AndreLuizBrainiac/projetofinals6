<div class="menu">
  <div class="panel panel-info">
    <div class="panel-heading">
      <div>
        <h1>Denúncias
          <div class="divBotoes">

            <button style="margin-right: 15px;" type="button" class="btn btn-success" (click)="redirectTO()">Nova
              Denúncia</button>
            <button type="button" class="btn btn-primary" (click)="onRefresh()">Atualizar</button>
          </div>
        </h1>

      </div>

    </div>
    <div class="panel-body">
      <table class="table table-hover" *ngIf="(denuncias$ | async) as denuncias; else loading">
        <thead>
          <tr>
            <th>#</th>
            <th>Denúncia</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr class="linhaListagem" *ngFor="let denunciaItemFor of denuncias;let i=index">
            <td>{{ i }}</td>
            <td>{{ denunciaItemFor.titulo }}</td>
            <td>
              <span class="float-right">
                <div class="divBotoesLista">
                  <button style="margin-right: 15px;" class="btn btn-primary" (click)="onEdit(denunciaItemFor)">
                    Atualizar
                  </button>

                  <button class="btn btn-danger" (click)="onDelete(denunciaItemFor)">
                    Remover
                  </button>
                </div>
              </span>
            </td>
          </tr>
        </tbody>
      </table>

      <ng-template #loading>
        <span>Carregando Denúncias...</span>
      </ng-template>

    </div>
  </div>
</div>
